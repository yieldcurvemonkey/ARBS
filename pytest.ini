[pytest]
# Pytest configuration for ARBS backtesting framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Coverage options (when using --cov)
# Run with: pytest --cov --cov-report=html
[coverage:run]
source = BT,Query,MDP,Signals,Risk,Optimizer,Backtest,Asset,Analysis,Adapter,Strategies,RVUtils
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require data)
    golden: Golden file regression tests
    slow: Slow tests (>1 second)
    futures: Tests related to futures
    swaps: Tests related to swaps
    backtest: Backtest engine tests
    mdp: Market data provider tests
    accounting: Settlement, margin, roll tests
    risk: Risk calculation tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
