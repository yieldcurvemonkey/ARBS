[pytest]
markers =
    integration: integration tests requiring live market data (deselect with '-m "not integration"')
    live: end-to-end tests requiring live market data (deselect with '-m "not live"')
    slow: takes >60s; excluded from the fast gate
    network: hits external services (DTCC, Barchart, Supabase)
    db: requires a live DATABASE_URL
